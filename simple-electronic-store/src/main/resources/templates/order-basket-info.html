<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.thymeleaf.org ">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<a th:href="@{/}">Домой</a>

<a th:href="@{/order/all}"><i class="fa fa-archive" style="font-size:36px; float: right"></i></a>

<h2>Текущие товары в корзине</h2>
<div th:each="orderItem : ${order.orderItems}" style="display: inline-block; width: 20%; overflow: hidden; border-style: solid; text-align: center">
    <h3>
        <p th:text="${orderItem.productInfo.title}" style="text-align: center"></p>
    </h3>
    <br>

    <p th:utext="${orderItem.productInfo.price}" style="text-align: center"></p>

    <br>
    <button th:onclick="addProductToBasket([[${orderItem.productInfo.id}]])">+</button>
    <p th:id="${orderItem.productInfo.id} + '_count'" th:text="${orderItem.productCount?:'0'}" style="text-align: center"></p>
    <button th:onclick="deleteProductFromBasket([[${orderItem.productInfo.id}]],[[${orderItem.id}]])">-</button>
    <br>
    <button th:onclick="clearBasket([[${orderItem.productInfo.id}]],[[${orderItem.id}]])">Удалить товар из корзины</button>
</div>

<p th:text="'Общая сумма заказа: ' + ${totalSum}"></p>

<button th:onclick="placeAnOrder()">Оформить заказ</button>

<script>
    function deleteProductFromBasket(productId, basketId) {
        if ((+document.getElementById(productId + '_count').innerHTML) > 0 ) {
            document.getElementById(productId + '_count').innerHTML = (+document.getElementById(productId + '_count').innerHTML) - (+1);
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", "/basket/delete/" + basketId, true);
            xhr.onload = function () {
                window.location.reload();
            }
            xhr.send();
        }
    }

    function addProductToBasket(productId) {
        document.getElementById(productId + '_count').innerHTML = (+document.getElementById(productId + '_count').innerHTML) + (+1);
        var xhr = new XMLHttpRequest();
        xhr.open("PUT", "/basket/add/" + productId, true);
        xhr.onload = function () {
            window.location.reload();
        }
        xhr.send();
    }

     function clearBasket(productId, basketId) {
        if ((+document.getElementById(productId + '_count').innerHTML) > 0 ) {
            document.getElementById(productId + '_count').innerHTML = 0;
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", "/basket/clear/" + basketId, true);
            xhr.onload = function () {
                window.location.reload();
            }
            xhr.send();
        }
    }

    function placeAnOrder() {
        var xhr = new XMLHttpRequest();
        xhr.open("PUT", "/order/place", true);
        xhr.onload = function () {
            alert("ВАШ ЗАКАЗ УСПЕШНО ОФОРМЛЕН");
            window.location.replace(window.location.origin);
        }
        xhr.send();
    }
</script>
</body>
</html>
